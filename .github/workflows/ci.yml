name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      # Vite 8 and Vitest 4 require Node >= 20.19 or >= 22.12.
      # Pinned to 24 to match the version the suite is verified against locally.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  backend:
    name: Backend vet, format, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      # Matches the `go` directive in go.mod.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache-dependency-path: backend/go.sum

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted. Run gofmt -w ."
            gofmt -l .
            exit 1
          fi

      # PostgreSQL integration tests self-skip when TEST_DATABASE_URL is unset, so this runs the
      # unit and HTTP contract tests only. See backend/CONTRIBUTING.md for the disposable-instance run.
      - name: Test
        run: go test ./... -count=1
