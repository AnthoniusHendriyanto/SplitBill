name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Vet, format, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Matches the `go` directive in go.mod.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache-dependency-path: go.sum

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted. Run gofmt -w ."
            gofmt -l .
            exit 1
          fi

      # PostgreSQL integration tests self-skip when TEST_DATABASE_URL is unset, so this runs the
      # unit and HTTP contract tests only. See CONTRIBUTING.md for the disposable-instance run.
      - name: Test
        run: go test ./... -count=1